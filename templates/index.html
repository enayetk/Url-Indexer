<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>URL Indexer</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:35px auto;padding:18px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0001;margin-bottom:18px}textarea{width:100%;height:250px;box-sizing:border-box;padding:14px;border:1px solid #d7ddea;border-radius:10px;font:14px monospace}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:12px 20px;font-weight:bold;margin-top:12px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f7f9fc;padding:14px;border-radius:10px}.num{font-size:24px;font-weight:bold}.bar{height:13px;background:#e8edf5;border-radius:20px}.fill{height:100%;width:0;background:#2563eb;border-radius:20px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}.table{overflow:auto;max-height:450px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class=wrap><div class=card><h1>URL Indexer</h1><p>Process up to 500 URLs per job. Technical crawl/discovery checks only; indexing is not guaranteed.</p><textarea id=u placeholder="https://example.com/page-1
https://example.com/page-2"></textarea><br><button id=b>START PROCESSING</button><span id=m></span></div><div class=card id=d style=display:none><h2>Job #<span id=j></span></h2><div class=stats><div class=stat>Total<div class=num id=t></div></div><div class=stat>Checked<div class=num id=c></div></div><div class=stat>Failed<div class=num id=f></div></div><div class=stat>Pending<div class=num id=p></div></div></div><div class=bar><div class=fill id=fill></div></div><p><span id=pc>0</span>% processed · <span id=st>Processing</span></p><a id=csv style=display:none>Download CSV results</a><div class=table><table><thead><tr><th>URL</th><th>Status</th><th>HTTP</th><th>Final URL</th><th>Message</th></tr></thead><tbody id=r></tbody></table></div></div></div><script>const $=x=>document.getElementById(x);let tm;$('b').onclick=async()=>{ $('b').disabled=true;$('m').textContent=' Starting...';let q=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls:$('u').value})});let d=await q.json();if(!q.ok){$('m').textContent=' '+d.error;$('b').disabled=false;return} $('d').style.display='block';$('j').textContent=d.job_id;tm=setInterval(()=>load(d.job_id),2000);load(d.job_id)};async function load(j){let d=await (await fetch('/api/jobs/'+j)).json();$('t').textContent=d.job.total;$('c').textContent=d.counts.Checked||0;$('f').textContent=(d.counts.Failed||0)+(d.counts['HTTP Error']||0);$('p').textContent=d.counts.Pending||0;let x=Math.round(d.done/d.job.total*100);$('pc').textContent=x;$('fill').style.width=x+'%';$('st').textContent=d.job.status;$('csv').href='/api/jobs/'+j+'/csv';$('csv').style.display='inline-block';$('r').innerHTML=d.rows.map(z=>'<tr><td>'+e(z.url)+'</td><td>'+e(z.status)+'</td><td>'+(z.http_status||'')+'</td><td>'+e(z.final_url||'')+'</td><td>'+e(z.message||'')+'</td></tr>').join('');if(d.job.status==='Completed'){clearInterval(tm);$('b').disabled=false}}function e(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}</script></body></html>
